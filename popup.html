<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeTracker Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── HEADER ── -->
  <header class="app-header">
    <div class="header-logo">
      <span class="logo-icon">⏱</span>
      <span class="logo-text">TimeTracker <b>Pro</b> <span style="font-size:0.6em; opacity:0.7">by Msorl</span></span>
    </div>
    <div class="live-indicator">
      <span class="live-dot"></span>
      <span id="live-domain">—</span>
    </div>
  </header>

  <!-- ── TABS DE PERÍODO ── -->
  <nav class="period-tabs" role="tablist">
    <button class="tab-btn active" data-period="day" role="tab">Hoy</button>
    <button class="tab-btn" data-period="week" role="tab">Semana</button>
    <button class="tab-btn" data-period="month" role="tab">Mes</button>
    <button class="tab-btn" data-period="calendar" role="tab">📅 Calendario</button>
    <button class="tab-btn" data-period="chart" role="tab">📊 Gráfico</button>
  </nav>

  <!-- ── CUERPO PRINCIPAL ── -->
  <main class="app-body">

    <!-- Vista: Ranking de dominios -->
    <section id="view-stats" class="view active">
      <div id="total-time-badge" class="total-badge">
        <span class="badge-label">Tiempo total</span>
        <span id="total-time-value" class="badge-value">—</span>
      </div>

      <!-- Botón Resumen (solo visible en 'Hoy') -->
      <button id="btn-summary" class="btn-summary hidden">Ver resumen del día</button>

      <div id="domain-list" class="domain-list">
        <div class="empty-state">Cargando datos…</div>
      </div>
    </section>

    <!-- Vista: Calendario mensual -->
    <section id="view-calendar" class="view">
      <div class="calendar-header">
        <button id="cal-prev" class="cal-nav-btn">&lt;</button>
        <span id="cal-month-year" class="cal-title">—</span>
        <button id="cal-next" class="cal-nav-btn">&gt;</button>
      </div>
      
      <div class="calendar-weekdays">
        <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
      
      <!-- Detalle del día seleccionado en el calendario -->
      <div id="calendar-day-details" class="calendar-details-section">
        <h3 id="cal-detail-date" class="details-title">Actividad</h3>
        <div id="cal-total-time" class="total-badge compact">
          <span class="badge-label">Total del día</span>
          <span id="cal-total-value" class="badge-value">—</span>
        </div>
        <div id="calendar-domain-list" class="domain-list">
          <div class="empty-state">Selecciona un día en el calendario para ver el detalle.</div>
        </div>
      </div>
    </section>

    <!-- Vista: Gráficos (últimos 7 días y Top de hoy) -->
    <section id="view-chart" class="view">
      <!-- Gráfico de barras local -->
      <div class="chart-header">
        <span class="chart-title">Actividad: últimos 7 días</span>
      </div>
      <div id="bar-chart-container" class="custom-bar-chart"></div>

      <!-- Gráfico de tarta local -->
      <div class="chart-header" style="margin-top: 24px">
        <span class="chart-title">Top sitios hoy</span>
      </div>
      <div class="pie-chart-wrap">
        <canvas id="pie-chart" width="320" height="150"></canvas>
        <div id="pie-chart-legend" class="pie-chart-legend"></div>
      </div>
    </section>

    <!-- Vista: Resumen del día (modal-like panel) -->
    <section id="view-summary" class="view">
      <button id="btn-back" class="btn-back">← Volver</button>
      <h2 class="summary-title">Resumen de hoy</h2>
      <p id="summary-date" class="summary-date">—</p>
      <div id="summary-content" class="summary-content">Cargando…</div>
    </section>

  </main>

  <!-- ── FOOTER ── -->
  <footer class="app-footer">
    <div class="footer-actions">
      <button id="btn-clear" class="btn-icon" title="Borrar todos los datos">🗑️</button>
      <button id="btn-export-db" class="btn-icon" title="Exportar copia de seguridad">📥</button>
      <button id="btn-import-db" class="btn-icon" title="Importar copia de seguridad">📤</button>
      <input type="file" id="input-import-db" accept=".json" style="display: none;" />
    </div>
    <span class="footer-note">Se pausa cuando estás inactivo</span>
  </footer>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
